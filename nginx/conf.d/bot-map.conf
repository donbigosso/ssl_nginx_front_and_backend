# Outside server{}, or at top of the 443 server block file if your nginx allows map in included conf:
map $http_user_agent $is_link_bot {
    default 0;
    "~*WhatsApp"              1;
    "~*facebookexternalhit"   1;
    "~*Facebot"               1;
    "~*Twitterbot"            1;
    "~*Discordbot"            1;
    "~*TelegramBot"           1;
    "~*LinkedInBot"           1;
    "~*Slackbot"              1;
    "~*SkypeUriPreview"       1;
    "~*Pinterest"             1;
}